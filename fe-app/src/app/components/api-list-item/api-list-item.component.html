<div class="list-item">

  <!-- Name -->
  <div class="row" style="display: flex;">
    <div class="column" style="margin-left: 10px;">
      <span style="line-height:50px; font-size: x-large;">
        {{resObj.data.name}}
      </span>
    </div>
    <div class="column" style="flex: content;width: fit-content;">
      <div class="button-icon-wrapper" style="float: right;margin: 5px" (click)="onDeleteItem()">
        <div class="material-icons" style="color : var(--brown);">delete_outline</div>
      </div>
      <div class="button-icon-wrapper" style="float: right;margin: 5px" (click)="onSelectedItem()">
        <div class="material-icons" style="color : var(--brown);">edit</div>
      </div>
    </div>
  </div>

  <!-- URL -->
  <div class="row" style="margin-left: 20px;">
    <span>
      URL: {{resObj.data.url}}
    </span>
  </div>

  <!-- if there is at least a method -->
  @if (mockApiResponses().length > 0) {
    <div style="margin-left: 20px;">
      <span> METHODS: </span>
      <span style="margin-left: 10px;">
        <ng-container>
          @for (resp of mockApiResponses(); track resp) {
            <button class="method-button">{{resp}}</button>
          }
        </ng-container>
      </span>
    </div>
  }

  <!-- if there is no method -->
  <ng-template #noMethods>
    No methods defined.
  </ng-template>

</div>
